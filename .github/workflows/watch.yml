name: Plaza watcher

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: plaza-watcher
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Watch for new listings
        env:
          WHATSAPP_RECIPIENTS: ${{ secrets.WHATSAPP_RECIPIENTS }}
          WATCH_REGIONS: "Nederland - Zuid-Holland"
          WATCH_CITIES: "Delft"
          URGENT_CITIES: "Delft"
          EXCLUDE_CATEGORIES: "voorVoertuig"
          MAX_RENT: "0"
          POLL_MINUTES: "350"
          POLL_SECONDS: "60"
          GIT_PERSIST: "1"
        run: python watcher.py

      - name: Hand off to the next watcher
        if: success() || failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run watch.yml --ref main
